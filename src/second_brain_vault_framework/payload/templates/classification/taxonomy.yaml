# Taxonomy — Generic Classification Template (Toy Example, 5 subdomains)
# Copy to campaigns/<campaign>/taxonomy.yaml and replace with your frozen vocabulary.
# Each subdomain: definition (≤3 lines), include/exclude, glossary_keys, diverse examples.

version: 1
campaign: example
subdomains:
  diabetes_monitoring:
    definition: "Docs whose primary purpose is tracking diabetes control — HbA1c, glucose trends, monitoring protocols."
    include: ["monitoring protocols", "HbA1c trending", "glucose logs"]
    exclude: ["general endocrinology without monitoring focus"]
    glossary_keys: [HbA1c, glucose]
    examples:
      - text: "Quarterly HbA1c follow-up protocol for type 2 patients. Target <7%, review every 3 months."
        source: "doc_0341.md"
        covers: "short protocol, explicit"
      - text: "Long-form essay on lifestyle factors in diabetes without naming HbA1c, focused on monitoring cadence."
        source: "doc_0891.md"
        covers: "lexically thin, implicit"

  prostate_screening:
    definition: "Docs about prostate cancer screening — PSA, PHI, biopsy thresholds, screening guidelines."
    include: ["PSA thresholds", "screening guidelines"]
    exclude: ["prostate treatment after diagnosis"]
    glossary_keys: [PSA, PHI]
    examples:
      - text: "PSA 4.2 ng/mL threshold discussion for biopsy referral in men over 55."
        source: "doc_1022.md"
        covers: "explicit, numeric"
      - text: "Comparison of PSA vs PHI test performance for early detection, sensitivity 0.82 vs 0.89."
        source: "doc_1023.md"
        covers: "comparison, two subdomains"

  nephrology:
    definition: "Docs about kidney function, CKD staging, creatinine, eGFR, dialysis referral."
    include: ["eGFR", "CKD staging"]
    exclude: ["diabetes-only without kidney context"]
    glossary_keys: [eGFR, creatinine]
    examples:
      - text: "eGFR 45 mL/min indicates Stage 3a CKD, monitor creatinine quarterly."
        source: "doc_0411.md"
        covers: "explicit"
      - text: "Boilerplate lab intake form with no test named, only generic fields."
        source: "doc_0412.md"
        covers: "thin/generic, I_GUESSED anchor"

  genetic_risk:
    definition: "Docs about genetic risk assessment — BRCA, panels, counseling, inheritance."
    include: ["BRCA", "gene panels"]
    exclude: ["somatic tumor sequencing for treatment"]
    glossary_keys: [BRCA]
    examples:
      - text: "BRCA1/2 panel results: pathogenic variant, referral to genetic counseling."
        source: "doc_0511.md"
        covers: "explicit"
      - text: "Family history intake noting maternal breast cancer at 42, no panel ordered yet."
        source: "doc_0512.md"
        covers: "implicit, history only"

  cardiology:
    definition: "Docs about cardiac risk, ECG, troponin, heart failure staging."
    include: ["ECG", "troponin"]
    exclude: ["vascular surgery without cardiac focus"]
    glossary_keys: [troponin, ECG]
    examples:
      - text: "Troponin I 0.12 ng/mL, ECG shows ST elevation, cath lab activated."
        source: "doc_0611.md"
        covers: "explicit, acute"
      - text: "Annual cardiac risk review, Framingham 12%, no acute markers."
        source: "doc_0612.md"
        covers: "implicit risk, not acute"
