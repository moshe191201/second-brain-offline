# Glossary — Generic Classification Template
# Maps surface forms to subdomains for implicit-reference resolution.
# Reused from Stage 5 glossary; deduplicated, versioned. Injected as domain_knowledge
# above examples, not as extra examples.

version: 1
campaign: example
terms:
  HbA1c:
    maps_to: diabetes_monitoring
    notes: "long-term glucose, ~90 day average"
    source: "glossary v1"
  glucose:
    maps_to: diabetes_monitoring
    notes: "blood glucose, fasting or random"
    source: "glossary v1"
  PSA:
    maps_to: prostate_screening
    notes: "prostate-specific antigen, ng/mL"
    source: "glossary v1"
  PHI:
    maps_to: prostate_screening
    notes: "Prostate Health Index, (-2)proPSA based"
    source: "glossary v1"
  eGFR:
    maps_to: nephrology
    notes: "estimated glomerular filtration rate"
    source: "glossary v1"
  creatinine:
    maps_to: nephrology
    notes: "serum creatinine, kidney function marker"
    source: "glossary v1"
  BRCA:
    maps_to: genetic_risk
    notes: "BRCA1/2 gene, hereditary risk"
    source: "glossary v1"
  troponin:
    maps_to: cardiology
    notes: "cardiac troponin I/T"
    source: "glossary v1"
  ECG:
    maps_to: cardiology
    notes: "electrocardiogram"
    source: "glossary v1"
