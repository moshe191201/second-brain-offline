# Monorepo CI: two products, two lanes.
#
#   framework  — second_brain_vault_framework, pure stdlib, cross-platform
#   pipeline   — ingest-pipeline/, ~11 dependencies, Windows in production
#
# Every stage is offline-safe except `pages` and `pipeline-unit` (which installs
# the pipeline's deps) — mirroring the air gap the framework has to survive in.

stages: [test, example, build, pages]

default:
  image: python:3.12-slim
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e .

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# Framework lane. `tests/` holds framework tests only, so this needs nothing
# installed beyond the package itself — which is the point of the split.
unit:
  stage: test
  script:
    - python -m unittest discover -s tests -v

# Pipeline lane. Separate deps, separate directory, and allowed to be heavy.
# Runs on Linux here; production is Windows (D1), and the YAP-dependent tests
# skip cleanly when YAP_DIR is unset.
pipeline-unit:
  stage: test
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r ingest-pipeline/requirements.txt
  script:
    - cd ingest-pipeline && python -m unittest discover -s tests -v

# example_vault/ is living documentation: it must always be a valid vault built
# by the *current* payload. If a payload change isn't laid down into it, the
# stamp/drift check in `vault check` fails here and not in a consumer's repo.
example-vault:
  stage: example
  script:
    - vault check example_vault
    # The staleness check used to live here as `git diff --exit-code`, which
    # never ran `vault upgrade` first — so on a fresh checkout the diff was
    # always empty and the job could not detect a stale example. It is now
    # tests/test_boundary.py::TestExampleVaultIsCurrent, run by the `unit` job.


wheel:
  stage: build
  script:
    - pip install build
    - python -m build
    # Prove the payload actually made it into the wheel.
    - python -c "import zipfile,glob,sys; n=[f for f in zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist() if '/payload/' in f]; print(len(n),'payload files'); sys.exit(0 if len(n)>=8 else 1)"
  artifacts:
    paths: [dist/]
    expire_in: 1 month

pages:
  stage: pages
  script:
    - pip install -e ".[docs]"
    - mkdocs build --site-dir public
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
